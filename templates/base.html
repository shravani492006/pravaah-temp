{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PRAVAAH - Trainer Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{% static 'css/styles.css' %}" rel="stylesheet">
    <link href="{% static 'css/custom.css' %}" rel="stylesheet">
</head>
<body>
    {% include 'navbar.html' %}

    <div class="container-fluid">
      <div class="row">
        {% if request.user.is_authenticated %}
          <aside id="sidebar" class="col-md-2 col-lg-2 bg-light sidebar py-3">
            {% include 'sidebar.html' %}
          </aside>
          <main class="col-md-10 col-lg-10 ms-sm-auto px-4 py-4">
        {% else %}
          <main class="col-12 py-4">
        {% endif %}

            {% block content %}{% endblock %}

          </main>
      </div>
    </div>

    {% include 'footer.html' %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      // sidebar toggle, tooltips and card hover with localStorage persistence
      document.addEventListener('DOMContentLoaded', function(){
        var toggle = document.getElementById('sidebarToggle');
        var sb = document.getElementById('sidebar');
        var storageKey = 'pravaah.sidebar.collapsed';

        // helper to get CSRF token from cookie
        function getCookie(name) {
          let cookieValue = null;
          if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
              const cookie = cookies[i].trim();
              if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
              }
            }
          }
          return cookieValue;
        }

        // restore collapsed state: prefer server-side preference when available
        try {
          if (sb) {
            fetch('/accounts/prefs/sidebar/', {credentials: 'same-origin'})
              .then(function(res){ if(!res.ok) throw new Error('no-pref'); return res.json() })
              .then(function(data){
                if(data && data.sidebar_collapsed){ sb.classList.add('collapsed'); try{ localStorage.setItem(storageKey, 'true'); }catch(e){} }
              })
              .catch(function(){
                try { var collapsed = localStorage.getItem(storageKey); if(collapsed === 'true' && sb) sb.classList.add('collapsed'); } catch(e) {}
              });
          }
        } catch(e) { /* ignore */ }

        if(toggle){
          // initialize aria-pressed
          try { toggle.setAttribute('aria-pressed', sb && sb.classList.contains('collapsed')); } catch(e){}

          toggle.addEventListener('click', function(e){
            e.preventDefault();
            if(!sb) return;
            sb.classList.toggle('collapsed');
            var isCollapsed = sb.classList.contains('collapsed');
            // save state to localStorage
            try { localStorage.setItem(storageKey, isCollapsed); } catch(e) {}
            // update aria-pressed
            try { toggle.setAttribute('aria-pressed', isCollapsed); } catch(e) {}
            // send to server (CSRF)
            try {
              var csrftoken = getCookie('csrftoken');
              fetch('/accounts/prefs/sidebar/', {
                method: 'POST',
                credentials: 'same-origin',
                headers: {
                  'Content-Type': 'application/json',
                  'X-CSRFToken': csrftoken,
                },
                body: JSON.stringify({collapsed: isCollapsed})
              }).catch(function(){/* ignore network errors */});
            } catch(err){}
          });
        }

        // enable Bootstrap tooltips
        var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'))
        tooltipTriggerList.map(function (el) { return new bootstrap.Tooltip(el) })

        // card hover effect
        document.querySelectorAll('.card').forEach(function(card){
          card.addEventListener('mouseenter', function(){ card.classList.add('shadow-lg', 'lift'); });
          card.addEventListener('mouseleave', function(){ card.classList.remove('shadow-lg', 'lift'); });
        });

      });
    </script>
</body>
</html>
