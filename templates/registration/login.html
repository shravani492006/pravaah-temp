{% extends 'base.html' %}
{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height:80vh; background: linear-gradient(135deg,#f8f9fa,#eef2f7);">
  <div class="card shadow-sm" style="width:420px;">
    <div class="card-body">
      <h4 class="card-title text-center mb-3">Sign in to PRAVAAH</h4>
      <form method="post" action="{% url 'accounts:login' %}">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Username or Email</label>
          <input class="form-control" type="text" name="username" required autofocus />
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input class="form-control" type="password" name="password" required />
        </div>
        <div class="d-flex justify-content-between align-items-center mb-3">
          <div><input type="checkbox" name="remember" /> Remember me</div>
          <div><a href="{% url 'accounts:password_reset' %}">Forgot?</a></div>
        </div>
        <button class="btn btn-primary w-100" type="submit">Sign in</button>
      </form>
      <div class="text-center mt-3 small text-muted">Need an account? Contact admin.</div>
    </div>
  </div>
</div>
{% endblock %}
