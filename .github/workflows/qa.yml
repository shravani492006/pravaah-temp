name: QA - accessibility

on:
  pull_request:
  workflow_dispatch:

jobs:
  a11y:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: pravaah
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_ENGINE: django.db.backends.mysql
      DB_NAME: pravaah
      DB_USER: root
      DB_PASSWORD: rootpass
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DJANGO_SETTINGS_MODULE: pravaah.settings
      UI_TEST_USERNAME: ui_test
      UI_TEST_PASSWORD: testpass

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run migrations
        run: |
          python manage.py migrate --noinput

      - name: Create test trainer and user
        run: |
          python - <<'PY'
from django.contrib.auth.models import User
from pravaah.trainers.models import Trainer
u='ui_test'
if not User.objects.filter(username=u).exists():
    user=User.objects.create_user(username=u,password='testpass',email='ui_test@example.com')
    Trainer.objects.create(trainer_code='UI_TEST', first_name='UI', last_name='Test', email='ui_test@example.com', joining_date='2026-01-01', user=user)
print('created test trainer')
PY

      - name: Start Django server
        run: |
          nohup python manage.py runserver 127.0.0.1:8000 &
          for i in {1..30}; do curl -sSf http://127.0.0.1:8000/ && break || sleep 2; done

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Playwright & axe deps
        run: |
          npm ci || npm install
          npx playwright install --with-deps || true

      - name: Run accessibility script
        run: |
          node tests/run_a11y.js
